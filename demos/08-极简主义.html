<!DOCTYPE html>
<html lang="zh-CN" data-canvas="1440x900" data-slug="08-minimalism-gallery">
<head>
<meta charset="utf-8">
<title>K-04 号作品 — 极简主义</title>
<link rel="stylesheet" href="_assets/taste-fonts.css">
<style>
/* ── 基因：极简主义 ────────────────────────────────────────
   激活词：Donald Judd · Agnes Martin · Ellsworth Kelly
           · less is more · gallery white · 日式 間
   上游种子：code-genes/04 · ch17 极简主义与观念艺术
   纪律：留白 ≥50%；灰阶只两级；一屏一个信息主体；
        每多一个元素先问"删掉会不会更好"。 */
:root{
  --bg:#ffffff;
  --text:#111111;
  --text-2:#6e6e6e;
  --block:#3d5afe;      /* Kelly 式点睛色块，整块使用，不做点缀 */
  --radius:0px;         /* 无圆角（0 或 24px 二选一，禁中间态）*/
  --font:'AB Inter','AB Noto Sans SC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1440px;height:900px;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-font-smoothing:antialiased}

/* 左侧大留白 + 右侧一个整块色面（不对称，比对称高级） */
.slab{position:absolute;right:0;top:0;width:396px;height:900px;background:var(--block)}

.canvas{position:absolute;left:96px;top:0;height:900px;width:840px;
  display:flex;flex-direction:column}

/* 导航极简到只剩三个词 */
.nav{display:flex;gap:34px;padding-top:64px;font-size:12px;letter-spacing:.06em;
  color:var(--text-2)}
.nav b{color:var(--text);font-weight:600}

/* 主信息：超大标题 + 极小注释，大小反差是张力的来源 */
.main{margin-top:auto;margin-bottom:auto}
.eyebrow{font-size:11px;letter-spacing:.32em;color:var(--text-2);text-transform:uppercase}
h1{margin-top:28px;font-size:132px;font-weight:600;line-height:.92;letter-spacing:-.045em}
h1 span{display:block;color:var(--text-2);font-weight:300}
.caption{margin-top:44px;font-size:11.5px;line-height:2.1;color:var(--text-2);
  max-width:340px;letter-spacing:.02em}

/* 底部：四个字段，用空格分隔，不用表格不用线 */
.meta{display:flex;gap:56px;padding-bottom:72px;font-size:11.5px;color:var(--text-2)}
.meta div b{display:block;color:var(--text);font-weight:600;margin-top:7px;font-size:12.5px;
  letter-spacing:.03em}

/* 署名：做成画廊标签的样子（贴在右侧色面上） */
.sig{position:absolute;right:44px;bottom:44px;width:308px;color:#ffffff;
  font-size:10px;line-height:1.9;letter-spacing:.1em}
.sig div{margin-bottom:6px}
.sig b{font-weight:600}
</style>
</head>
<body>
  <div class="slab">
    <footer class="sig">
      <div>风格基因 <b>极简主义</b> · 辅 Kelly 式单色面</div>
      <div>Built by <b>pi agent</b> × <b>DeepSeek V4.1 Flash</b></div>
      <div>场景随机抽取 · 风格按 agent-taste-seed-system 基因库落成</div>
    </footer>
  </div>

  <div class="canvas">
    <nav class="nav"><b>作品</b><span>索引</span><span>关于</span></nav>

    <div class="main">
      <div class="eyebrow">Collection 2018 — 2026</div>
      <h1>K-04<span>号作品</span></h1>
      <p class="caption">一块 40×40 cm 的哑光铝板上，什么都不画。<br>
      观众站得越久，越会觉得自己在看的不只是铝板。</p>
    </div>

    <div class="meta">
      <div>材质<b>阳极氧化铝</b></div>
      <div>尺寸<b>40 × 40 cm</b></div>
      <div>年份<b>2024</b></div>
      <div>版数<b>3 / 5</b></div>
    </div>
  </div>

</body>
</html>
